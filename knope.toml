[package]
versioned_files = ["crates/x402-proxy/Cargo.toml", "Cargo.lock"]
changelog = "CHANGELOG.md"
scopes = ["x402-proxy"]

[[workflows]]
name = "document-change"
help_text = "Record a changeset for the next release"
[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"
help_text = "Bump version + update changelog + consume changesets (no push)"
[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "get-version"
[[workflows.steps]]
type = "Command"
command = 'echo "$version"'

[github]
owner = "nachog00"
repo = "x402-proxy"
