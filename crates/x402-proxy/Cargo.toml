[package]
name = "x402-proxy"
version = "0.1.4"
edition.workspace = true
description = "stdio MCP proxy that auto-signs x402 payments for an upstream HTTP MCP server"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["x402", "mcp", "payments", "ethereum", "usdc"]
categories = ["command-line-utilities"]

# cargo-binstall: pull prebuilt binaries from the GitHub release (tag `v{version}`,
# assets `x402-proxy-<target>.tar.gz`, binary at the archive root). Matches the
# naming produced by taiki-e/upload-rust-binary-action in release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Windows ships as a .zip (taiki-e uses zip on windows).
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
alloy-primitives = { version = "1.6", features = ["rand"] }
alloy-signer = { version = "2.1", features = ["eip712"] }
alloy-signer-local = { version = "2.1", features = ["eip712"] }
alloy-sol-types = "1.6"
# Provider stack — only used by the `approve-permit2` setup command, which
# broadcasts one on-chain USDC.approve(Permit2) tx.
alloy-provider = { version = "2.1", features = ["reqwest-rustls-tls"] }
alloy-network = "2.1"
alloy-contract = "2.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "2.2", features = [
    "server",
    "client",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync"] }
toml = "0.8"
url = "2"
zeroize = "1"
