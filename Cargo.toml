[package]
name = "x402-proxy"
version = "0.1.0"
edition = "2024"
description = "stdio MCP proxy that auto-signs x402 payments for an upstream HTTP MCP server"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync"] }
zeroize = "1"
