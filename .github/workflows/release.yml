name: Release
# On merge to main: if Cargo.toml's version has no tag yet, tag it, create the
# GitHub release, publish to crates.io, and fast-forward dev. Nothing pushes to
# main (the bump arrived via the merged PR); tags and dev aren't protected, so
# GITHUB_TOKEN suffices — no PAT.
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Untagged version?
        id: v
        run: |
          V=$(grep -m1 '^version' crates/x402-proxy/Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$V already released."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.v.outputs.release == 'true'
      - name: Tag + GitHub release
        if: steps.v.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.v.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
          notes=$(awk -v v="$V" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "v$V" --title "$V" --notes "${notes:-Release $V}"
      - name: Publish to crates.io
        if: steps.v.outputs.release == 'true'
        run: cargo publish -p x402-proxy
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Fast-forward dev
        if: steps.v.outputs.release == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git checkout -B dev origin/dev
          if git merge --no-edit "${{ github.sha }}"; then
            git push origin dev
          else
            git merge --abort
            echo "::warning::dev reconcile conflict — back-merge main into dev manually"
          fi
