name: Changeset required
on:
  pull_request:
    branches: [dev]
jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a changeset (unless the PR is docs/CI/tooling only)
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'

          # A changeset in the PR always satisfies the gate.
          added=$(git diff --diff-filter=A --name-only "$base" "$head" -- .changeset/ | grep -E '\.md$' || true)
          if [ -n "$added" ]; then
            echo "Found changeset(s):"; echo "$added"
            exit 0
          fi

          # Otherwise: only require one if the PR touches release-bearing files.
          # Non-bearing = never shipped in the published crate's behavior: docs,
          # CI, and repo tooling. Anything else (crate src, Cargo.toml, Cargo.lock,
          # containers, etc.) needs a changeset.
          nonbearing='^(\.github/|docs/|.*\.md$|LICENSE|\.gitignore$|\.gitattributes$|knope\.toml$|Makefile\.toml$|codecov\.ya?ml$|\.?rustfmt\.toml$|clippy\.toml$)'
          bearing=$(git diff --name-only "$base" "$head" | grep -vE "$nonbearing" || true)

          if [ -z "$bearing" ]; then
            echo "Only docs/CI/tooling changed — no changeset required."
            exit 0
          fi

          echo "::error::No changeset, but these release-bearing files changed:"
          echo "$bearing"
          echo "::error::Run 'knope document-change' and commit the file it adds under .changeset/ (a patch-level entry is fine for small changes)."
          exit 1
