name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make
      - run: cargo make ci

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-tarpaulin
      - name: Coverage (gate + job summary)
        run: |
          set -o pipefail
          cargo make coverage-ci | tee coverage.out
          pct=$(grep -oE '[0-9]+\.[0-9]+% coverage' coverage.out | tail -1)
          echo "### 📊 Coverage: ${pct:-n/a}" >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v4
        continue-on-error: true   # stays green until CODECOV_TOKEN is configured
        with:
          files: target/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
