name: Release preview
# On any PR into main, comment the version that merging will release (derived by
# knope from the PR's changesets), or note that no release will be cut.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changesets present?
        id: c
        run: |
          if find .changeset -name '*.md' -type f 2>/dev/null | grep -q .; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.c.outputs.has == 'true'
      - uses: knope-dev/action@v2.1.2
        if: steps.c.outputs.has == 'true'
        with:
          version: 0.23.0
      - name: Build & post preview comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ steps.c.outputs.has }}" = "true" ]; then
            DRY=$(knope release --dry-run 2>&1 || true)
            VERSION=$(printf '%s' "$DRY" | grep -oiE 'tag v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed -E 's/.*[vV]//')
            CHANGES=$(printf '%s' "$DRY" | sed -n '/and body:/,$p' | tail -n +2)
            BODY=$(printf '### 📦 Release preview\n\nMerging this PR into `main` will release **v%s** and publish `x402-proxy` to crates.io.\n\n<details><summary>Changelog</summary>\n\n%s\n</details>\n\n<sub>Derived by knope from this PR'"'"'s changesets. Pre-1.0: a `minor` change bumps the patch; a breaking change bumps the minor.</sub>' "$VERSION" "$CHANGES")
          else
            BODY=$(printf '### 📦 Release preview\n\nNo changesets in this PR — **no release** will be cut on merge.\n\nIf this should ship, run `knope document-change` and commit the file it adds under `.changeset/`.')
          fi
          gh pr comment "$PR" --edit-last --body "$BODY" \
            || gh pr comment "$PR" --body "$BODY"
