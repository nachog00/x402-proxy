name: Release PR
# On push to dev: if there are changesets, knope prepares the release (bump +
# changelog + consume changesets) on a throwaway `release-next` branch and opens
# a PR release-next -> main. Nothing is pushed to main. No changesets => close it.
on:
  push:
    branches: [dev]
permissions:
  contents: write
  pull-requests: write
concurrency: release-pr
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
      - name: Changesets present?
        id: c
        run: |
          if find .changeset -name '*.md' -type f 2>/dev/null | grep -q .; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: knope-dev/action@v2.1.2
        if: steps.c.outputs.has == 'true'
        with:
          version: 0.23.0
      - name: Prepare release on release-next
        if: steps.c.outputs.has == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          knope prepare-release --verbose
          V=$(grep -m1 '^version' crates/x402-proxy/Cargo.toml | cut -d'"' -f2)
          git checkout -B release-next
          git add -A
          git commit -m "chore: release v$V"
          git push -f origin release-next
          notes=$(awk -v v="$V" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md)
          body=$(printf 'Merging this PR releases **v%s** and publishes to crates.io.\n\n## Changelog\n\n%s\n' "$V" "$notes")
          if [ "$(gh pr list --base main --head release-next --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head release-next --title "Release v$V" --body "$body"
          else
            n=$(gh pr list --base main --head release-next --state open --json number --jq '.[0].number')
            gh pr edit "$n" --title "Release v$V" --body "$body"
          fi
      - name: No changesets — close any open release PR
        if: steps.c.outputs.has == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh pr list --base main --head release-next --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh pr close "$n" --delete-branch; else echo "no open release PR"; fi
